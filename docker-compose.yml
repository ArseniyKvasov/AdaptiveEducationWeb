services:
  app:
    build: .
    ports:
      - "8090:8090"
    environment:
      - PORT=8090
      - DB_PATH=/app/data/app.db
      - SESSION_SECRET=${SESSION_SECRET:-change-me-in-production}
      - ML_URL=${ML_URL:-https://ml.fastclass.ru}
      - ML_API_KEY=${ML_API_KEY:-}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
